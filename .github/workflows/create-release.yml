name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without a v prefix or build metadata
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  preflight:
    needs: ci
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      prepared: ${{ steps.state.outputs.prepared }}
      release_commit_sha: ${{ steps.state.outputs.release_commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: state
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch origin main --tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          release_state=absent
          if gh release view "v$VERSION" --json isDraft --jq .isDraft > release-draft; then
            if [[ "$(cat release-draft)" == true ]]; then release_state=draft; else release_state=published; fi
          fi
          bash scripts/release-state.sh --main-ref origin/main --github-release-state "$release_state" "$VERSION" >> "$GITHUB_OUTPUT"

  prepare:
    needs: preflight
    if: needs.preflight.outputs.prepared == 'false'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_commit_sha: ${{ steps.commit.outputs.release_commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev
      - env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          bash scripts/prepare-release.sh "$VERSION"
          changed="$(git diff --name-only)"
          test -n "$changed"
          test "$(printf '%s\n' "$changed" | grep -Ev '^(package\.json|bun\.lock|src-tauri/Cargo\.toml|src-tauri/Cargo\.lock|src-tauri/tauri\.conf\.json|CHANGELOG\.md)$' || true)" = ""
          bun install --frozen-lockfile
          bun run check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
      - id: commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "chore(release): v$VERSION"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          echo "release_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: [preflight, prepare]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src-tauri
      - run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libssl-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config rpm
      - env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run tauri build --bundles deb,appimage,rpm
          bundle=src-tauri/target/release/bundle
          test "$(find "$bundle/deb" -maxdepth 1 -name '*.deb' -type f | wc -l)" = 1
          test "$(find "$bundle/appimage" -maxdepth 1 -name '*.AppImage' -type f | wc -l)" = 1
          test "$(find "$bundle/rpm" -maxdepth 1 -name '*.rpm' -type f | wc -l)" = 1
          mkdir release-assets
          deb="$(find "$bundle/deb" -maxdepth 1 -name '*.deb' -type f)"
          appimage="$(find "$bundle/appimage" -maxdepth 1 -name '*.AppImage' -type f)"
          rpm_package="$(find "$bundle/rpm" -maxdepth 1 -name '*.rpm' -type f)"
          cp "$deb" "release-assets/kmux-desktop_${VERSION}_amd64.deb"
          cp "$appimage" "release-assets/kmux-desktop_${VERSION}_x86_64.AppImage"
          cp "$rpm_package" "release-assets/kmux-desktop-${VERSION}-1.x86_64.rpm"
          dpkg-deb --info "release-assets/kmux-desktop_${VERSION}_amd64.deb"
          test "$(dpkg-deb --field "release-assets/kmux-desktop_${VERSION}_amd64.deb" Version)" = "$VERSION"
          test "$(dpkg-deb --field "release-assets/kmux-desktop_${VERSION}_amd64.deb" Architecture)" = amd64
          dpkg-deb --contents "release-assets/kmux-desktop_${VERSION}_amd64.deb" > deb-contents.txt
          mkdir deb-extracted
          dpkg-deb --extract "release-assets/kmux-desktop_${VERSION}_amd64.deb" deb-extracted
          find deb-extracted/usr/bin -maxdepth 1 -type f -perm -111 -print -quit | grep -q .
          find deb-extracted/usr/share/applications -maxdepth 1 -name '*.desktop' -type f -print -quit | grep -q .
          find deb-extracted/usr/share/icons -type f -print -quit | grep -q .
          sudo apt-get install --yes "./release-assets/kmux-desktop_${VERSION}_amd64.deb"
          dpkg-query --show kmux-desktop
          sudo apt-get remove --yes kmux-desktop
          rpm -qpi "release-assets/kmux-desktop-${VERSION}-1.x86_64.rpm"
          test -n "$(rpm -qp --qf '%{VERSION}' "release-assets/kmux-desktop-${VERSION}-1.x86_64.rpm")"
          test -n "$(rpm -qp --qf '%{RELEASE}' "release-assets/kmux-desktop-${VERSION}-1.x86_64.rpm")"
          test "$(rpm -qp --qf '%{ARCH}' "release-assets/kmux-desktop-${VERSION}-1.x86_64.rpm")" = x86_64
          rpm -qlp "release-assets/kmux-desktop-${VERSION}-1.x86_64.rpm" > rpm-contents.txt
          grep -Eq '/usr/bin/[^/]+$' rpm-contents.txt
          grep -Eq '/usr/share/applications/.*\.desktop$' rpm-contents.txt
          grep -Eq '/usr/share/icons/' rpm-contents.txt
          file "release-assets/kmux-desktop_${VERSION}_x86_64.AppImage"
          test -x "release-assets/kmux-desktop_${VERSION}_x86_64.AppImage"
          (cd release-assets && "./kmux-desktop_${VERSION}_x86_64.AppImage" --appimage-extract >/dev/null)
          test -f "release-assets/squashfs-root/AppRun"
          find release-assets/squashfs-root -name '*.desktop' -print -quit | grep -q .
          find release-assets/squashfs-root -path '*icons*' -print -quit | grep -q .
          find release-assets/squashfs-root -type f -name kmux-desktop -perm -111 -print -quit | grep -q .
          (cd release-assets && sha256sum *.deb *.AppImage *.rpm > SHA256SUMS)
          for asset in release-assets/*.deb release-assets/*.AppImage release-assets/*.rpm; do sha256sum "$asset" > "$asset.sha256"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kmux-desktop-release-bundles
          path: release-assets

  validate-artifacts:
    needs: [preflight, prepare, build-linux]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kmux-desktop-release-bundles
          path: ${{ runner.temp }}/release-assets
      - env:
          VERSION: ${{ inputs.version }}
          ASSETS: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          assets=("kmux-desktop_${VERSION}_amd64.deb" "kmux-desktop_${VERSION}_amd64.deb.sha256" "kmux-desktop_${VERSION}_x86_64.AppImage" "kmux-desktop_${VERSION}_x86_64.AppImage.sha256" "kmux-desktop-${VERSION}-1.x86_64.rpm" "kmux-desktop-${VERSION}-1.x86_64.rpm.sha256" SHA256SUMS)
          for asset in "${assets[@]}"; do test -f "$ASSETS/$asset"; done
          (cd "$ASSETS" && sha256sum -c SHA256SUMS)
          bash scripts/extract-release-notes.sh "$VERSION" > "$ASSETS/release-notes.md"
          printf '%s\n' '' '## Installation' '' \
            'Debian/Ubuntu: download the `.deb` package and install it with `sudo apt install ./PACKAGE.deb`.' '' \
            'Fedora/RPM-based: download the `.rpm` package and install it with `sudo dnf install ./PACKAGE.rpm`.' '' \
            'AppImage: download the `.AppImage`, mark it executable with `chmod +x`, and run it directly.' '' \
            'Verify downloaded assets with `sha256sum -c SHA256SUMS --ignore-missing`.' >> "$ASSETS/release-notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kmux-desktop-release-assets
          path: ${{ runner.temp }}/release-assets

  finalize-github:
    needs: [preflight, prepare, validate-artifacts]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kmux-desktop-release-assets
          path: ${{ runner.temp }}/release-assets
      - env:
          VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
          ASSETS: ${{ runner.temp }}/release-assets
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          bash scripts/release-state.sh --main-ref origin/main --github-release-state absent "$VERSION" | grep -Fxq "release_commit_sha=$RELEASE_COMMIT"
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            test "$(git rev-parse "$tag^{}")" = "$RELEASE_COMMIT"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$tag" "$RELEASE_COMMIT" --message "Release v$VERSION"
            git push origin "$tag"
          fi
          assets=("kmux-desktop_${VERSION}_amd64.deb" "kmux-desktop_${VERSION}_amd64.deb.sha256" "kmux-desktop_${VERSION}_x86_64.AppImage" "kmux-desktop_${VERSION}_x86_64.AppImage.sha256" "kmux-desktop-${VERSION}-1.x86_64.rpm" "kmux-desktop-${VERSION}-1.x86_64.rpm.sha256" SHA256SUMS)
          for asset in "${assets[@]}" release-notes.md; do test -f "$ASSETS/$asset"; done
          if gh release view "$tag" --json isDraft --jq .isDraft > release-draft; then
            if [[ "$(cat release-draft)" == true ]]; then
              gh release upload "$tag" "${assets[@]/#/$ASSETS/}" --clobber
              gh release edit "$tag" --draft=false
            else
              for asset in "${assets[@]}"; do gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; done
            fi
          else
            prerelease=(); case "$VERSION" in *-*) prerelease=(--prerelease);; esac
            gh release create "$tag" --draft "${prerelease[@]}" --title "$tag" --notes-file "$ASSETS/release-notes.md"
            gh release upload "$tag" "${assets[@]/#/$ASSETS/}"
            gh release edit "$tag" --draft=false
          fi
